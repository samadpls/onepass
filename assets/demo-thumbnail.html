<!doctype html><html><head><meta charset="utf-8">
<!-- Rendered to demo-thumbnail.png with headless Chrome: chrome --headless --hide-scrollbars --window-size=1200,254
     --force-device-scale-factor=2 --default-background-color=00000000 --virtual-time-budget=8000
     --screenshot=assets/demo-thumbnail.png assets/demo-thumbnail.html -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --blue:#1c2bf0; --tile:#3744f1; --yellow:#ffc61a; }
  * { box-sizing:border-box; margin:0; }
  .card { width:1200px; background:var(--blue); border-radius:24px; padding:40px; display:grid;
          grid-template-columns:repeat(3,1fr); gap:22px; color:#fff; font-family:"Bricolage Grotesque",sans-serif; }
  .tile { background:var(--tile); border-radius:20px; padding:26px 30px 29px; }
  b { display:block; color:var(--yellow); font-size:76px; font-weight:800; line-height:1; }
  span { display:block; margin-top:15px; font-size:28px; font-weight:600; line-height:1; }
</style></head><body>
<div class="card">
  <div class="tile"><b>60%</b><span>on the benchmark</span></div>
  <div class="tile"><b>0</b><span>words generated</span></div>
  <div class="tile"><b>640 MB</b><span>runs on your laptop</span></div>
</div>
</body></html>
